<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교내 센서 재고 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  :root{
    --ink:#2d3748; --sub:#718096; --line:#a7f3d0; --bg:#f0fdf4; --card:#ffffff;
    --accent:#059669; --accent-soft:#d1fae5;
    --pasco:#2563eb; --science:#ea580c; --pocket:#7c3aed; --other:#64748b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
  a{color:inherit; text-decoration: none;}
  
  header{background:linear-gradient(135deg,#059669,#10b981);color:#fff;padding:40px 20px 32px}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px}
  header h1{margin:0 0 6px;font-size:clamp(24px,4vw,34px);letter-spacing:-0.5px}
  header p{margin:0;opacity:.95;font-size:15px}
  
  .stats{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
  .stat{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:8px 14px;}
  .stat b{font-size:20px;display:block;}

  .manual-bar{background:#fff;border-bottom:1px solid var(--line);padding:14px 0;box-shadow:0 2px 8px rgba(5,150,105,0.06);position:sticky;top:0;z-index:20}
  .manual-links{display:flex;gap:10px;overflow-x:auto;align-items:center}
  .manual-label{font-weight:700;font-size:14px;color:var(--accent);white-space:nowrap;margin-right:6px}
  .m-btn{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;color:#fff;white-space:nowrap;transition:0.2s}
  .m-btn.pasco{background:var(--pasco)}
  .m-btn.science{background:var(--science)}
  .m-btn.pocket{background:var(--pocket)}
  .m-btn:hover{opacity:0.85;transform:translateY(-1px)}
  
  section{padding:36px 0}
  h2{font-size:24px;margin:0 0 6px;color:#047857;}
  .lead{color:var(--sub);margin:0 0 20px;font-size:14px}
  
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
  .controls input,.controls select{padding:10px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff; transition: all 0.2s;}
  .controls input:focus, .controls select:focus{outline:none; border-color:var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);}
  .controls input{flex:1;min-width:200px}
  
  .table-container{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow: 0 4px 12px rgba(5,150,105,0.06);overflow-x:auto}
  table{width:100%;border-collapse:collapse;text-align:left;font-size:15px;min-width:600px}
  th{background:#ecfdf5;color:#047857;padding:14px 18px;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:14px 18px;border-bottom:1px solid #f1f5f9;color:var(--ink);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#f8fafc}
  
  .company-badge{display:inline-block;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;color:#fff}
  .badge-PASCO{background:var(--pasco)}
  .badge-사이언스큐브{background:var(--science)}
  .badge-포켓랩{background:var(--pocket)}
  .badge-기타{background:var(--other)}

  .qty-box{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--accent)}
  .edit-btn{background:none;border:1px solid var(--line);border-radius:6px;width:28px;height:28px;cursor:pointer;display:grid;place-items:center;color:var(--sub);transition:0.2s}
  .edit-btn:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

  .add-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin-top:24px;box-shadow: 0 4px 12px rgba(5,150,105,0.06)}
  .add-card h3{margin:0 0 16px;color:#047857;font-size:18px}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .form-grid input, .form-grid select{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
  .form-grid input:focus, .form-grid select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  
  .btn{display:inline-block;margin-top:14px;border:none;background:var(--accent);color:#fff;font:inherit;font-weight:700;padding:10px 20px;border-radius:10px;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 6px rgba(5,150,105,0.2)}
  .btn:hover{background:#047857;transform:translateY(-2px)}
  .btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent);box-shadow:none}
  .btn.ghost:hover{background:var(--accent-soft)}

  dialog{border:none;border-radius:20px;padding:0;max-width:400px;width:calc(100% - 24px);box-shadow:0 25px 50px -12px rgba(0,0,0,0.25)}
  dialog::backdrop{background:rgba(5,150,105,0.4);backdrop-filter:blur(4px)}
  .dhead{padding:20px 24px;border-bottom:1px solid var(--line);background:#fff}
  .dbody{padding:24px;background:#fff}
  .dbody label{display:block;font-weight:700;font-size:14px;margin-bottom:8px;color:#047857}
  .dbody input, .dbody select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-bottom:16px}
  .dfoot{padding:12px 24px;background:#f8fafc;display:flex;justify-content:flex-end;gap:8px}

  footer{text-align:center;color:var(--sub);font-size:13px;padding:30px 20px 50px}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>📋 교내 센서 재고 관리 시스템</h1>
    <p>우리 학교 과학실 디지털 센서 및 탐구 장비 현황을 실시간으로 관리하세요.</p>
    <div class="stats">
      <div class="stat"><b id="statKinds">-</b>센서 종류</div>
      <div class="stat"><b id="statTotal">-</b>총 보유 수량</div>
    </div>
  </div>
</header>

<div class="manual-bar">
  <div class="wrap manual-links">
    <span class="manual-label">📖 제조사 매뉴얼:</span>
    <a href="https://pascokorea.com/%EC%84%BC%EC%84%9C-%EB%A7%A4%EB%89%B4%EC%96%BC" target="_blank" class="m-btn pasco">PASCO 매뉴얼</a>
    <a href="https://sciencecubeshop.cafe24.com/article/%EC%9E%90%EC%A3%8C%EC%8B%A4/1/26290/categoryno/4/" target="_blank" class="m-btn science">사이언스큐브 자료실</a>
    <a href="https://innosci.notion.site/" target="_blank" class="m-btn pocket">포켓랩 설명서(Notion)</a>
  </div>
</div>

<main class="wrap">
  <section>
    <h2>보유 센서 목록</h2>
    <p class="lead">센서 품명, 제조사, 보관 장소를 확인하고 수량을 수정할 수 있습니다.</p>
    
    <div class="controls">
      <input id="search" type="search" placeholder="센서 이름 또는 회사명 검색...">
      <select id="placeFilter">
        <option value="">보관장소 전체</option>
        <option>생물실</option>
        <option>물리지학실</option>
        <option>화학실</option>
        <option>준비실</option>
      </select>
    </div>

    <div class="company-toggles" id="companyToggles" style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
      <button class="toggle-btn active" data-company="" style="padding:6px 14px; border-radius:20px; border:1px solid #16a34a; background:#16a34a; color:#fff; font-weight:700; cursor:pointer; font-size:13px; transition:0.2s;">전체 회사</button>
      <button class="toggle-btn" data-company="PASCO" style="padding:6px 14px; border-radius:20px; border:1px solid #c7d2fe; background:#fff; color:#2563eb; font-weight:700; cursor:pointer; font-size:13px; transition:0.2s;">PASCO</button>
      <button class="toggle-btn" data-company="사이언스큐브" style="padding:6px 14px; border-radius:20px; border:1px solid #fed7aa; background:#fff; color:#ea580c; font-weight:700; cursor:pointer; font-size:13px; transition:0.2s;">사이언스큐브</button>
      <button class="toggle-btn" data-company="포켓랩" style="padding:6px 14px; border-radius:20px; border:1px solid #e9d5ff; background:#fff; color:#7c3aed; font-weight:700; cursor:pointer; font-size:13px; transition:0.2s;">포켓랩</button>
      <button class="toggle-btn" data-company="-" style="padding:6px 14px; border-radius:20px; border:1px solid #cbd5e1; background:#fff; color:#64748b; font-weight:700; cursor:pointer; font-size:13px; transition:0.2s;">기타/미분류</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>센서 종류</th>
            <th>회사명</th>
            <th>수량</th>
            <th>보관 위치</th>
          </tr>
        </thead>
        <tbody id="sensorTableBody">
          <tr><td colspan="4" style="text-align:center;padding:30px;color:var(--sub)">데이터를 불러오는 중입니다...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="add-card">
      <h3>➕ 새로운 기기 추가하기</h3>
      <div class="form-grid">
        <input id="newName" type="text" placeholder="센서 종류 (예: 무선 조도센서)">
        <select id="newCompany">
          <option value="PASCO">PASCO</option>
          <option value="사이언스큐브">사이언스큐브</option>
          <option value="포켓랩">포켓랩</option>
          <option value="-">-</option>
        </select>
        <input id="newQty" type="number" placeholder="수량" min="1" value="1">
        <select id="newPlace">
          <option value="생물실">생물실</option>
          <option value="물리지학실">물리지학실</option>
          <option value="화학실">화학실</option>
          <option value="준비실">준비실</option>
        </select>
      </div>
      <button class="btn" id="addBtn">기기 등록하기</button>
    </div>
  </section>
</main>

<dialog id="editModal">
  <div class="dhead">
    <h3 style="margin:0;color:#047857">센서 정보 수정</h3>
  </div>
  <div class="dbody">
    <label id="editSensorName" style="margin-bottom:12px;display:block;font-size:15px;color:var(--ink)"></label>
    
    <label for="editQtyInput">수량 변경</label>
    <input type="number" id="editQtyInput" min="0">

    <label for="editPlaceSelect">보관 위치 변경</label>
    <select id="editPlaceSelect">
      <option value="생물실">생물실</option>
      <option value="물리지학실">물리지학실</option>
      <option value="화학실">화학실</option>
      <option value="준비실">준비실</option>
    </select>
  </div>
  <div class="dfoot">
    <button class="btn ghost" id="closeModalBtn">취소</button>
    <button class="btn" id="saveEditBtn">저장하기</button>
  </div>
</dialog>

<footer>
  <p>© 2026 교내 과학실 센서 재고 관리 시스템. All rights reserved.</p>
</footer>
